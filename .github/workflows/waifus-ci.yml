name: Waifus direct-only fork

on:
  push:
    branches:
      - "waifus/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waifus-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  pins-and-license:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Verify upstream and toolchain lock
        shell: bash
        run: |
          set -euo pipefail
          lock_value() {
            awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1) }' WAIFUCAVE_UPSTREAM.lock
          }

          test "$(lock_value format)" = "waifucave-upstream-lock-v1"
          test "$(lock_value upstream_repository)" = "tailscale/tailscale"
          test "$(lock_value upstream_tag)" = "v1.102.2"
          test "$(lock_value upstream_commit)" = "eb67e5dcbe145d63e1128b9b4b630f8a82da101f"
          test "$(lock_value go_version)" = "1.26.5"
          test "$(sed -n 's/^go //p' go.mod)" = "$(lock_value go_version)"
          test "$(tr -d '\r\n' < go.toolchain.version)" = "$(lock_value go_version)"
          test "$(go env GOVERSION)" = "go$(lock_value go_version)"

          upstream_commit="$(lock_value upstream_commit)"
          upstream_tag="$(lock_value upstream_tag)"
          test "$(git rev-parse "refs/tags/${upstream_tag}^{}")" = "$upstream_commit"
          git merge-base --is-ancestor "$upstream_commit" HEAD
      - name: Check source licenses
        run: go test -run=TestLicenseHeaders .

  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run focused fork tests
        run: go test ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/...

  race:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run focused race tests
        run: go test -race ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/magicsock
      - name: Run direct-only race tests
        run: go test -race -tags=waifus_direct_only ./ipn/ipnlocal ./wgengine ./wgengine/magicsock ./tsnet ./cmd/waifus-direct-spike ./tstest/waifuscontrol

  linux-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run tagged Linux tests
        run: go test -tags=waifus_direct_only ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/... ./cmd/waifus-direct-spike ./tstest/waifuscontrol
      - name: Audit direct-only choke points
        run: go run ./tool/waifus-direct-audit
      - name: Install packet-matrix tools
        run: sudo apt-get update && sudo apt-get install --yes iproute2 tcpdump
      - name: Run privileged feasibility matrix
        shell: bash
        env:
          WAIFUS_SPIKE_ARTIFACT_DIR: ${{ runner.temp }}/waifus-spike
        run: |
          set -euo pipefail
          sudo -n env \
            GOTOOLCHAIN=local \
            GO_BINARY="$(command -v go)" \
            GOPATH="$(go env GOPATH)" \
            GOCACHE="$(go env GOCACHE)" \
            GOMODCACHE="$(go env GOMODCACHE)" \
            WAIFUS_REPOSITORY_ROOT="${GITHUB_WORKSPACE}" \
            WAIFUS_SPIKE_ARTIFACT_DIR="${WAIFUS_SPIKE_ARTIFACT_DIR}" \
            ./tool/waifus-spike/run-netns-matrix.sh
      - name: Preserve packet evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: waifus-linux-packet-evidence
          path: ${{ runner.temp }}/waifus-spike/
          if-no-files-found: warn
          retention-days: 14

  platform-smoke:
    name: Native smoke (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-26
          - name: windows-amd64
            runner: windows-2025
          - name: windows-arm64
            runner: windows-11-arm
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run native direct-only lifecycle
        run: go test -tags=waifus_direct_only ./cmd/waifus-direct-spike ./tstest/waifuscontrol -count=1

  linux-armv7-abi-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Install ARM userspace emulator
        run: sudo apt-get update && sudo apt-get install --yes qemu-user
      - name: Build and run static ARMv7 harness under QEMU
        shell: bash
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/waifus-direct-spike-linux-arm-v7.test"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go test -c \
            -tags=waifus_direct_only \
            -o "${binary}" \
            ./cmd/waifus-direct-spike
          qemu-arm "${binary}" \
            -test.run '^(TestDirectOnlyPairLifecycleAndOfflineRevocation|TestDirectOnlyUnavailableNeverRelays)$' \
            -test.count=1

  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Compile helper-facing packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -tags=waifus_direct_only ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine ./wgengine/magicsock ./cmd/waifus-direct-spike
      - name: Cross-compile feasibility harness
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/waifus-cross-build"
          mkdir -p "${output_dir}"
          suffix=""
          if [[ "${GOOS}" == "windows" ]]; then
            suffix=".exe"
          fi
          go test -c \
            -tags=waifus_direct_only \
            -o "${output_dir}/waifus-direct-spike-${GOOS}-${GOARCH}${GOARM:+-v${GOARM}}${suffix}" \
            ./cmd/waifus-direct-spike
      - name: Preserve cross-compiled harness
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: waifus-spike-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: ${{ runner.temp }}/waifus-cross-build/
          if-no-files-found: error
          retention-days: 14
