name: Waifus direct-only fork

on:
  push:
    branches:
      - "waifus/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waifus-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  pins-and-license:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Verify upstream and toolchain lock
        shell: bash
        run: |
          set -euo pipefail
          lock_value() {
            awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1) }' WAIFUCAVE_UPSTREAM.lock
          }

          test "$(lock_value format)" = "waifucave-upstream-lock-v1"
          test "$(lock_value upstream_repository)" = "tailscale/tailscale"
          test "$(lock_value upstream_tag)" = "v1.102.2"
          test "$(lock_value upstream_commit)" = "eb67e5dcbe145d63e1128b9b4b630f8a82da101f"
          test "$(lock_value go_version)" = "1.26.5"
          test "$(sed -n 's/^go //p' go.mod)" = "$(lock_value go_version)"
          test "$(tr -d '\r\n' < go.toolchain.version)" = "$(lock_value go_version)"
          test "$(go env GOVERSION)" = "go$(lock_value go_version)"

          upstream_commit="$(lock_value upstream_commit)"
          upstream_tag="$(lock_value upstream_tag)"
          test "$(git rev-parse "refs/tags/${upstream_tag}^{}")" = "$upstream_commit"
          git merge-base --is-ancestor "$upstream_commit" HEAD
      - name: Check source licenses
        run: go test -run=TestLicenseHeaders .

  focused:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run focused fork tests
        run: go test ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/...

  race:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run focused race tests
        run: go test -race ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/magicsock
      - name: Run direct-only race tests
        run: go test -race -tags=waifus_direct_only ./ipn/ipnlocal ./wgengine/magicsock ./tsnet

  linux-feasibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Run tagged Linux tests
        run: go test -tags=waifus_direct_only ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine/...
      - name: Audit direct-only choke points
        run: go run ./tool/waifus-direct-audit
      - name: Run privileged feasibility matrix when present
        shell: bash
        run: |
          set -euo pipefail
          script=./tool/waifus-spike/run-netns-matrix.sh
          if [[ ! -x "$script" ]]; then
            echo "Phase 2 Task 6 will add the privileged network-namespace matrix."
            exit 0
          fi
          sudo -n "$script"

  compile:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install locked Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: "1.26.5"
          cache: true
      - name: Compile helper-facing packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -tags=waifus_direct_only ./control/controlclient ./ipn/ipnlocal ./tsnet ./wgengine ./wgengine/magicsock
